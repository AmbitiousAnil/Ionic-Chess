
<ion-content class="ion-padding">

    <ion-toolbar>
       
        <ion-button slot="start" class="btn-profile" fill="clear" (click)="go('tabs/profile')">
            <img src="/assets/images/user-16.png" alt="">
        </ion-button>
        
      
        <ion-button slot="end" fill="clear" class="btn-bell" (click)="go('tabs/notifications')">
            <ion-badge color="danger">3</ion-badge>
            <img src="assets/icon/notifications.svg">
        </ion-button>
       
    </ion-toolbar>

  <div class="logo">
    <img src="/assets/images/chess-pieces-logo.png">
  </div>
  <div class="button">
    <ion-button class="trapezoid" (click)="play();">Play</ion-button>
  </div>  

    <div class="challenge">
        <ion-button strong="true" shape="round" class="challenge-btn" (click)="go('tabs/challenges')">
            <img src="./../../assets/images/war-2.png">Challenges <ion-badge color="danger">12</ion-badge>
        </ion-button>
    </div>
  <ion-row>
    <ion-col size="6">
        <ion-button class="img-btn" (click)="go('tabs/game-selection')">
            <div class="btn-wrap">
                <img src="./../../assets/icon/play-online.svg" alt="">
                <h4>Play Online</h4>
            </div>
        </ion-button>
    </ion-col>
    <ion-col size="6">
        <ion-button  class="img-btn" (click)="go('tabs/friends')">
            <div class="btn-wrap">
                <img src="./../../assets/icon/play-friend.svg" alt="">
                <h4>Play Friend</h4>
            </div>
        </ion-button>
    </ion-col>
    <ion-col size="6">
        <ion-button class="img-btn" (click)="go('tabs/practice')">
            <div class="btn-wrap">
                <img src="./../../assets/icon/practice.svg" alt="">
                <h4>Practice</h4>
            </div>
        </ion-button>
    </ion-col>
    <ion-col size="6">
        <ion-button class="img-btn" (click)="go('tabs/achievements')">
            <div class="btn-wrap">
                <img src="./../../assets/icon/achievements.png" alt="">
                <h4>Medals</h4>
            </div>
        </ion-button>
    </ion-col>
</ion-row>
  

</ion-content>
