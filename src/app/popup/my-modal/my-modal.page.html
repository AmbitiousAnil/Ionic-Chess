

<ion-content>

  <ion-grid *ngIf = "type == 'timer'">
    <ion-row>
      <ion-col text-center>
       {{message}}
      </ion-col>
    </ion-row>
    <ion-row>  
      <ion-col text-center>
        {{battleTimer}} Seconds
      </ion-col>
    </ion-row>
  </ion-grid>

  <ion-grid *ngIf=" type == 'friend-request-sent'">
    <ion-row class="header">
      <ion-col>
       <h1><b>Success</b></h1> 
      </ion-col>
    </ion-row>
    <ion-row>  
      <ion-col class="content-body">
        <div class="icon">
          <img src="./assets/icon/check-icon.svg" alt="check-icon">
        </div>
        
        <p class="message"> Your Friend Request is Sent</p>
      </ion-col>
    </ion-row>
    <ion-row >  
      <ion-col class="footer" text-center>
        <ion-button color="primary" (click)="closeModal()">Okay</ion-button>
      </ion-col>
    </ion-row>
  </ion-grid> 
  <ion-grid *ngIf=" type == 'game-payment'">
    <ion-row class="header">
      <ion-col>
       <h1><b>Confirm Payment</b></h1> 
      </ion-col>
    </ion-row>
    <ion-row>  
      <ion-col class="content-body">
        <ion-item>
          <ion-icon name="wallet-outline"></ion-icon>
          <ion-label><h2>Wallet Balance: <b>₹200</b></h2>  </ion-label>
        </ion-item>
        <ion-item>
          <ion-label>Entry Fee</ion-label>
          <ion-label>₹10</ion-label>
        </ion-item>
        <ion-item>
          <ion-label> <span>By Clicking Confirm you allow us to Deduct Entry fees from your wallet balance</span></ion-label>
        </ion-item>  

      </ion-col> 
    </ion-row> 
    <ion-row >  
      <ion-col class="footer" text-center>
        <ion-button color="primary" (click)="confirmPayment()">Confirm & Pay</ion-button>
      </ion-col>
    </ion-row>    
  </ion-grid>   


</ion-content>
